services:
  cineflix:
    build: .
    container_name: cineflix
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env   # THEMOVIEDB_API_KEY, ACCOUNTS_SECRET (paths are set by the image)
    environment:
      MOVIES_PATH: /movies
      MOVIES_INFOS_PATH: /data/movies.json
      ACCOUNTS_PATH: /data/accounts.enc
    volumes:
      - ${MOVIES_DIR:-/srv/movies}:/movies:ro
      - ${DATA_DIR:-/srv/cineflix-data}:/data
