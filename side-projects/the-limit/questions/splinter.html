<!doctype html>
<html lang="en">
    <head>
       <meta charset="utf-8" />
       <meta name="viewport" content="width=device-width, initial-scale=1" />
       <title>The limit</title>
       <link href="/style.css" media="screen" rel="stylesheet" />
       <link rel="icon" href="/assets/logo.png" sizes="any">
       <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TS32BL7E3N"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-TS32BL7E3N');

    </head>
    <body>
        <div class="container">
            <h1 class="title">Is it a splinter ?</h1>
            <div class="row spaced-evenly centered stage">
                <div class="panel">
                    <img src="/assets/splinter_hand.png" class="reference" />
                    <span>19 cm<br/>7,5 inches</span>
                </div>
                <div class="panel">
                    <img src="/assets/splinter_og.png" class="case" />
                    <span id="size"></span>
                </div>
            </div>
            <div class="actions">
                <button id="no">No</button>
                <button id="yes">Yes</button>
            </div>
        </div>
        <script>
            const yes = document.querySelector("#yes");
            const no = document.querySelector("#no");
            let size = 1;

            const refreshSize = () => {
                document.querySelector("#size").innerHTML=`${size/10} cm<br/>${(size/10*0.393700787).toFixed(2)} inches`;
            };

            document.querySelector(".case").style.transform=`scale(${size*1/190})`;
            refreshSize();
            
            yes.onclick = () => {
                size += 5;
                if (size > 190) {
                    document.querySelector(".reference").style.transform=`scale(${190/size})`;
                } else {
                    document.querySelector(".case").style.transform=`scale(${size*1/190})`;
                }
                refreshSize();
            };
            
            no.onclick = () => submitAnswer(size);
        </script>
    </body>
</html>
