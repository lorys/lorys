services:
  app:
    build: .
    image: the-limit:latest
    restart: unless-stopped
    env_file: /srv/the-limit/.env
    ports:
      - "127.0.0.1:2998:3000"
    extra_hosts:
      - "host.docker.internal:172.29.0.1"
    networks:
      - the-limit
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  the-limit:
    name: the-limit
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-thelimit
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
