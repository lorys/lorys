<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>Minigames</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b10;
      --fg: #f2f2f2;
      --accent: #4ade80;
      --muted: #8a8a99;
      --line: #33333f;
      --card: #13131a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 { font-size: 48px; letter-spacing: 0.15em; margin: 0; font-weight: 800; }
    .tagline { color: var(--muted); margin: 8px 0 40px; }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .game {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    .game:hover, .game:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }

    .preview {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--bg);
      border-bottom: 2px solid var(--line);
    }

    .info { padding: 16px 18px 20px; }
    .info h2 { margin: 0 0 6px; font-size: 22px; }
    .info p { margin: 0 0 12px; color: var(--muted); line-height: 1.4; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span {
      font-size: 13px;
      padding: 3px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
    }

    /* Pong preview: two paddles, a ball and the centre line. */
    .pong .net { position: absolute; left: 10%; right: 10%; top: 50%; border-top: 2px dashed #26262f; }
    .pong .paddle { position: absolute; left: 50%; width: 22%; height: 5%; border-radius: 2px; }
    .pong .top { top: 10%; background: var(--fg); transform: translateX(-80%); }
    .pong .bottom { bottom: 10%; background: var(--accent); transform: translateX(-30%); }
    .pong .ball {
      position: absolute;
      width: 4%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--fg);
      animation: rally 2.4s ease-in-out infinite alternate;
    }
    @keyframes rally {
      from { left: 38%; top: 17%; }
      to { left: 58%; top: 76%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pong .ball { animation: none; left: 48%; top: 46%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>MINIGAMES</h1>
    <p class="tagline">Small games that run in the browser.</p>

    <ul class="games">
      <li>
        <a class="game" href="pong/">
          <div class="preview pong" aria-hidden="true">
            <div class="net"></div>
            <div class="paddle top"></div>
            <div class="ball"></div>
            <div class="paddle bottom"></div>
          </div>
          <div class="info">
            <h2>Pong</h2>
            <p>Classic Pong, one phone each. Pair by scanning QR codes, first to 7 wins.</p>
            <div class="tags"><span>2 players</span><span>2 phones</span><span>Same Wi-Fi</span></div>
          </div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
